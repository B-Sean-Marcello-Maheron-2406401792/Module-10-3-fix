<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YewChat</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@700;900&family=Rajdhani:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #020408; --panel: #040a10; --border: #0a2a1a;
            --neon: #00ff9d; --neon2: #00cfff; --neon3: #ff2d78;
            --text: #c8ffe0; --muted: #2a5040;
            --glow: 0 0 8px #00ff9d88, 0 0 20px #00ff9d22;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width:100%; height:100%; background:var(--bg); color:var(--text); font-family:'Rajdhani',sans-serif; overflow:hidden; }
        body::before { content:''; position:fixed; inset:0; background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,157,0.015) 2px,rgba(0,255,157,0.015) 4px); pointer-events:none; z-index:9999; }

        #login { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; gap:28px; }
        .login-header { text-align:center; }
        .login-header h1 { font-family:'Orbitron',monospace; font-size:2.4rem; font-weight:900; color:var(--neon); text-shadow:var(--glow); letter-spacing:8px; }
        .login-header p { font-family:'Share Tech Mono',monospace; color:var(--muted); font-size:0.7rem; letter-spacing:2px; }
        .avatar-picker { display:flex; flex-direction:column; align-items:center; gap:10px; }
        .avatar-label { font-family:'Share Tech Mono',monospace; font-size:0.62rem; color:var(--muted); letter-spacing:2px; }
        .avatar-grid { display:flex; gap:8px; flex-wrap:wrap; justify-content:center; max-width:380px; }
        .avatar-opt { width:42px; height:42px; border:1px solid var(--border); border-radius:4px; font-size:20px; background:transparent; cursor:pointer; transition:all 0.15s; }
        .avatar-opt:hover, .avatar-opt.selected { border-color:var(--neon); box-shadow:var(--glow); background:rgba(0,255,157,0.08); }
        .login-form { width:360px; max-width:92vw; display:flex; flex-direction:column; gap:12px; }
        .field-label { font-family:'Share Tech Mono',monospace; font-size:0.62rem; color:var(--muted); letter-spacing:2px; margin-bottom:4px; }
        .neon-input { width:100%; padding:10px 14px; background:rgba(0,255,157,0.03); border:1px solid var(--border); border-radius:2px; color:var(--neon); font-family:'Share Tech Mono',monospace; font-size:0.88rem; outline:none; caret-color:var(--neon); transition:border-color 0.2s,box-shadow 0.2s; }
        .neon-input:focus { border-color:var(--neon); box-shadow:var(--glow); }
        .login-error { font-family:'Share Tech Mono',monospace; font-size:0.68rem; color:var(--neon3); text-align:center; }
        .btn-connect { padding:12px; background:transparent; border:1px solid var(--neon); color:var(--neon); font-family:'Orbitron',monospace; font-size:0.75rem; font-weight:700; letter-spacing:4px; cursor:pointer; text-shadow:var(--glow); box-shadow:var(--glow); transition:background 0.2s; }
        .btn-connect:hover { background:rgba(0,255,157,0.1); }

        .chat-screen { display:flex; flex-direction:column; height:100vh; width:min(860px,100vw); margin:0 auto; }
        .chat-header { display:flex; align-items:center; justify-content:space-between; padding:10px 20px; border-bottom:1px solid var(--border); background:var(--panel); flex-shrink:0; }
        .brand { display:flex; flex-direction:column; }
        .brand-name { font-family:'Orbitron',monospace; font-size:1rem; font-weight:900; color:var(--neon); text-shadow:var(--glow); letter-spacing:4px; }
        .brand-sub { font-family:'Share Tech Mono',monospace; font-size:0.58rem; color:var(--muted); }
        .status { font-family:'Share Tech Mono',monospace; font-size:0.68rem; color:var(--muted); border:1px solid var(--border); padding:4px 10px; border-radius:2px; }
        .status.live { color:var(--neon); border-color:var(--neon); text-shadow:var(--glow); }
        .header-right { display:flex; align-items:center; gap:10px; }
        .user-pill { font-family:'Share Tech Mono',monospace; font-size:0.72rem; color:var(--neon); border:1px solid var(--neon); border-radius:2px; padding:4px 12px; box-shadow:var(--glow); }
        .btn-dc { padding:5px 12px; background:transparent; border:1px solid var(--neon3); color:var(--neon3); font-family:'Orbitron',monospace; font-size:0.6rem; letter-spacing:2px; cursor:pointer; }
        .btn-dc:hover { background:rgba(255,45,120,0.1); }

        .messages { flex:1; overflow-y:auto; padding:16px 20px; display:flex; flex-direction:column; gap:8px; scroll-behavior:smooth; }
        .messages::-webkit-scrollbar { width:3px; }
        .messages::-webkit-scrollbar-thumb { background:var(--border); }
        .msg { display:flex; flex-direction:column; max-width:68%; }
        .msg.self  { align-self:flex-end;   align-items:flex-end; }
        .msg.other { align-self:flex-start; align-items:flex-start; }
        .msg.sys   { align-self:center; max-width:80%; }
        .msg-meta { display:flex; align-items:center; gap:6px; font-family:'Share Tech Mono',monospace; font-size:0.62rem; color:var(--muted); margin-bottom:3px; }
        .addr { color:#1a3028; }
        .msg-bubble { padding:8px 14px; font-size:0.88rem; line-height:1.5; word-break:break-word; }
        .msg.self  .msg-bubble { background:rgba(0,255,157,0.07); border:1px solid rgba(0,255,157,0.25); border-radius:2px 2px 0 2px; color:var(--neon); }
        .msg.other .msg-bubble { background:rgba(0,207,255,0.05); border:1px solid rgba(0,207,255,0.15); border-radius:2px 2px 2px 0; color:#a0e8ff; }
        .msg.sys   .msg-bubble { background:transparent; border:1px dashed var(--border); font-family:'Share Tech Mono',monospace; font-size:0.66rem; color:var(--muted); padding:5px 14px; }
        .msg-time { font-family:'Share Tech Mono',monospace; font-size:0.58rem; color:var(--muted); margin-top:2px; }

        .input-area { display:flex; align-items:center; gap:10px; padding:12px 20px; border-top:1px solid var(--border); background:var(--panel); flex-shrink:0; }
        .prompt { font-family:'Share Tech Mono',monospace; font-size:0.9rem; color:var(--neon); text-shadow:var(--glow); }
        .msg-input { flex:1; padding:10px 12px; background:transparent; border:none; border-bottom:1px solid var(--border); color:var(--neon); font-family:'Share Tech Mono',monospace; font-size:0.88rem; outline:none; caret-color:var(--neon); }
        .msg-input:focus { border-color:var(--neon); }
        .msg-input:disabled { opacity:0.3; }
        .msg-input::placeholder { color:var(--muted); }
        .btn-send { padding:9px 18px; background:transparent; border:1px solid var(--neon); color:var(--neon); font-family:'Orbitron',monospace; font-size:0.65rem; font-weight:700; letter-spacing:3px; cursor:pointer; text-shadow:var(--glow); }
        .btn-send:hover { background:rgba(0,255,157,0.1); }
        .btn-send:disabled { opacity:0.25; cursor:not-allowed; }

        /* About Screen Styles */
        #about-screen { display:flex; align-items:center; justify-content:center; height:100vh; background:radial-gradient(circle at center, #0a1520 0%, #020408 100%); }
        .about-container { width:min(600px, 90vw); padding:40px; background:rgba(4,10,16,0.8); border:1px solid var(--border); position:relative; overflow:hidden; }
        .about-container::before { content:''; position:absolute; top:0; left:0; width:100%; height:2px; background:linear-gradient(90deg, transparent, var(--neon), transparent); animation:scan 3s infinite linear; }
        @keyframes scan { 0% { transform:translateX(-100%); } 100% { transform:translateX(100%); } }

        .about-header h2 { font-family:'Orbitron',monospace; font-size:1.8rem; color:var(--neon); text-shadow:var(--glow); margin-bottom:10px; }
        .glitch-line { height:1px; background:var(--muted); margin-bottom:30px; position:relative; }
        .glitch-line::after { content:''; position:absolute; top:0; left:0; width:30%; height:1px; background:var(--neon); box-shadow:var(--glow); }

        .about-content section { margin-bottom:24px; }
        .about-content h3 { font-family:'Share Tech Mono',monospace; font-size:0.9rem; color:var(--neon2); margin-bottom:8px; opacity:0.8; }
        .about-content p { font-size:0.95rem; color:var(--text); line-height:1.6; opacity:0.9; }

        .tech-list { list-style:none; margin-top:10px; }
        .tech-list li { font-family:'Share Tech Mono',monospace; font-size:0.85rem; margin-bottom:6px; display:flex; gap:10px; }
        .tech-list li span { color:var(--muted); min-width:120px; }

        .creativity-quote { margin-top:20px; padding:15px; border-left:2px solid var(--neon3); background:rgba(255,45,120,0.05); font-style:italic; color:var(--neon3); }
        .quote-source { font-size:0.7rem; font-family:'Share Tech Mono',monospace; opacity:0.7; font-style:normal; margin-top:5px; display:block; }

        .btn-back { margin-top:20px; padding:10px 20px; background:transparent; border:1px solid var(--muted); color:var(--muted); font-family:'Share Tech Mono',monospace; font-size:0.8rem; cursor:pointer; transition:all 0.2s; }
        .btn-back:hover { border-color:var(--neon); color:var(--neon); box-shadow:var(--glow); }

        .header-links { margin-top:10px; }
        .link-btn { background:transparent; border:none; color:var(--muted); font-family:'Share Tech Mono',monospace; font-size:0.7rem; cursor:pointer; letter-spacing:1px; }
        .link-btn:hover { color:var(--neon2); text-decoration:underline; }
    </style>

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';

    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();

                this.poll_interval);

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();

    }

</html>
